services:
  api:
    command: 'uvicorn api.main:api --proxy-headers --host 0.0.0.0 --port 8000 --root-path /api'

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:2026.9.1
    command: 'tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token'
    depends_on:
      go_autocomplete:
        condition: service_healthy
    restart: unless-stopped
    secrets:
      - cloudflare_tunnel_token

  postgres:
    container_name: postgres_n8n
    image: postgres:17-bookworm
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_n8n_admin_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
      - ./postgres/n8n-init:/docker-entrypoint-initdb.d:ro
    networks:
      - n8n_backend
    secrets:
      - postgres_n8n_admin_password
      - n8n_postgres_password

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:2.15.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_postgres_password
      DB_POSTGRESDB_SCHEMA: public
      N8N_HOST: '${SERVER_IP}'
      N8N_PROTOCOL: http
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: 'http://${SERVER_IP}:81/'
      WEBHOOK_URL: 'http://${SERVER_IP}:81/'
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: '${GENERIC_TIMEZONE:-America/Boise}'
      N8N_SECURE_COOKIE: false
      N8N_SAMESITE_COOKIE: lax
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - default
      - n8n_backend
    secrets:
      - n8n_postgres_password
      - n8n_encryption_key
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.n8n.entrypoints=web'
      - 'traefik.http.routers.n8n.rule=Host(`${SERVER_IP}`)'
      - 'traefik.http.routers.n8n.priority=1'
      - 'traefik.http.services.n8n.loadbalancer.server.port=5678'

  dashboard:
    build:
      context: ./dashboard
      target: pro
    volumes: !reset []
    # command: 'serve -l 5173 -l tcp://0.0.0.0:5173 -s dist'
    command: |
      sh -c "
      pnpm build &&
      serve -l 5173 -s dist
      "

  slack_bot:
    container_name: slack_bot
    build:
      context: ./slackbot
    command: 'python3 slackbot/main.py'
    volumes:
      - ./slackbot:/app/slackbot
    restart: 'unless-stopped'
    secrets:
      - slack_bot_token
      - slack_app_token

  speedtest:
    container_name: speedtest
    build:
      context: ./speedtest
    command: 'python3 -u main.py'

  plex:
    container_name: plex
    image: lscr.io/linuxserver/plex:latest
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - TZ=Etc/UTC
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./plex:/config
      - media:/media
    devices:
      - /dev/dri:/dev/dri
    ports:
      - '32400:32400'
    restart: 'unless-stopped'

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - '53:53/tcp'
      - '53:53/udp'
      # Default HTTP Port
      - '84:80/tcp'
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - '443:443/tcp'
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: 'America/Boise'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      WEBPASSWORD_FILE: pihole_password
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
      FTLCONF_dns_listeningMode: 'all'
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './etc-pihole:/etc/pihole'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped

volumes:
  postgres_n8n_data:
  n8n_data:

networks:
  n8n_backend:
    internal: true

secrets:
  cloudflare_tunnel_token:
    file: './secrets/cloudflare_tunnel_token.txt'
  postgres_n8n_admin_password:
    file: './secrets/postgres_n8n_admin_password.txt'
  n8n_postgres_password:
    file: './secrets/n8n_postgres_password.txt'
  n8n_encryption_key:
    file: './secrets/n8n_encryption_key.txt'
